<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1B30" />
      <stop offset="70%" stop-color="#060B16" />
      <stop offset="100%" stop-color="#020409" />
    </radialGradient>

    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="fav-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="fav-chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <filter id="fav-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Shield with Bright Cyan Border -->
  <rect width="128" height="128" rx="28" fill="url(#fav-bg)" />
  <rect width="124" height="124" x="2" y="2" rx="26" stroke="url(#fav-cyan)" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Outer Chrome Vault Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#fav-chrome)" stroke-width="4.5" />
  
  <!-- Vault Radial Indicator Ticks -->
  <line x1="64" y1="18" x2="64" y2="24" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="64" y1="104" x2="64" y2="110" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="64" x2="24" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <line x1="104" y1="64" x2="110" y2="64" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing Cyan Ring -->
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#fav-cyan)" stroke-width="3.5" filter="url(#fav-neon-glow)" />

  <!-- Acoustic Frequency Waveforms -->
  <path d="M 28 64 L 32 56 L 36 72 L 40 48 L 44 80 L 48 64" 
        fill="none" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-neon-glow)" />
  <path d="M 80 64 L 84 48 L 88 80 L 92 56 L 96 72 L 100 64" 
        fill="none" stroke="#00F0FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#fav-neon-glow)" />

  <!-- Gold SV Monogram -->
  <!-- S-Wave -->
  <path d="M 50 46 C 50 36, 70 35, 74 45 C 76 52, 60 56, 62 64 C 64 72, 80 72, 80 62" 
        fill="none" stroke="#040711" stroke-width="8" stroke-linecap="round" />
  <path d="M 50 46 C 50 36, 70 35, 74 45 C 76 52, 60 56, 62 64 C 64 72, 80 72, 80 62" 
        fill="none" stroke="url(#fav-gold)" stroke-width="4.5" stroke-linecap="round" />

  <!-- V-Spear -->
  <path d="M 46 44 L 64 90 L 86 40" 
        fill="none" stroke="#040711" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 46 44 L 64 90 L 86 40" 
        fill="none" stroke="url(#fav-gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radiant Vertex Glint -->
  <circle cx="64" cy="90" r="2.5" fill="#FFFFFF" filter="url(#fav-neon-glow)" />
</svg>
